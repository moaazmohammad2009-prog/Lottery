<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottery & Zodiac Presentation Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
            color: #f8fafc;
            position: relative;
        }

        .top-controls {
            position: absolute;
            top: 15px;
            right: 20px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            padding: 12px 18px;
            border-radius: 12px;
            z-index: 1000;
            display: flex;
            gap: 20px;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .main-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: calc(100vh - 140px);
            padding: 30px;
        }

        .chart-box {
            width: 48%;
            background: transparent;
            border-radius: 16px;
            padding: 20px;
            max-height: 75vh;
            overflow-y: auto;
        }

        .chart-box h3 {
            text-align: center;
            margin-bottom: 15px;
            color: #38bdf8;
            font-size: 18px;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
            text-align: center;
            font-size: 14px;
        }

        th {
            background: rgba(15, 23, 42, 0.8);
            color: #38bdf8;
            font-weight: 600;
            padding: 12px;
            border-bottom: 2px solid rgba(56, 189, 248, 0.3);
            border-radius: 8px;
        }

        td {
            padding: 8px;
            background: transparent;
        }

        .lottery-ball {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            font-weight: bold;
            color: #000;
            position: relative;
            box-shadow: inset -4px -4px 10px rgba(0,0,0,0.4), inset 3px 3px 6px rgba(255,255,255,0.7), 0 4px 8px rgba(0,0,0,0.4);
            margin: 2px;
            font-size: 15px;
            line-height: 1;
        }

        .lottery-ball::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 7px;
            width: 14px;
            height: 7px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            transform: rotate(-30deg);
        }

        .lottery-ball .num-val {
            color: #000 !important;
        }

        .lottery-ball span.z-sub {
            font-size: 8px;
            font-weight: 700;
            color: #000 !important;
            margin-top: 1px;
            text-shadow: 0 0 2px rgba(255,255,255,0.6);
        }

        .ball-green { background: radial-gradient(circle at 35% 35%, #4ade80, #15803d); }
        .ball-red { background: radial-gradient(circle at 35% 35%, #f87171, #b91c1c); }

        .bottom-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 130px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border-top: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 -10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .balls-container {
            display: flex;
            gap: 15px;
        }

        .ball-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .ball-wrapper:hover {
            transform: scale(1.1);
        }

        .ball-wrapper .lottery-ball {
            width: 58px;
            height: 58px;
            font-size: 18px;
        }

        .ball-wrapper .lottery-ball::after {
            top: 7px;
            left: 9px;
            width: 18px;
            height: 9px;
        }

        .floating-text {
            position: absolute;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            border: 1px dashed #38bdf8;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: move;
            z-index: 500;
            min-width: 220px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            pointer-events: auto;
        }

        /* الـ Placeholder الثابت غير القابل للتعديل */
        .watermark-text {
            position: relative;
            color: #94a3b8;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 0.5px;
            pointer-events: none; /* بيمنع الماوس يتعامل معاه كأنه نص قابل للكتابة */
            user-select: none;
        }

        /* حقل حقيقي مخفي يتم الكتابة فيه يظهر فوق أو يختفي الـ placeholder عند الكتابة */
        .editable-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            text-align: center;
            font-size: 16px;
            font-family: inherit;
            padding: 12px 24px;
            z-index: 2;
        }

        .editable-input:not(:placeholder-shown) + .watermark-text {
            display: none;
        }

        .text-formatting-bar {
            display: none;
            gap: 8px;
            margin-top: 8px;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            background: rgba(15, 23, 42, 0.7);
            padding: 6px;
            border-radius: 6px;
            color: #94a3b8;
            position: relative;
            z-index: 3;
        }

        .floating-text:hover .text-formatting-bar,
        .floating-text.active .text-formatting-bar {
            display: flex;
        }

        .text-controls {
            position: absolute;
            top: 15px;
            left: 20px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            padding: 12px;
            border-radius: 12px;
            z-index: 1000;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .text-controls button, .save-btn, .settings-btn {
            padding: 8px 16px;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            border: none;
            cursor: pointer;
            font-weight: 600;
            border-radius: 8px;
            color: #fff;
            transition: opacity 0.2s;
        }

        .save-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            padding: 8px 24px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            width: 420px;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-content h3 {
            color: #38bdf8;
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-content label {
            display: block;
            margin-top: 12px;
            font-size: 14px;
            color: #cbd5e1;
        }

        .modal-content input, .modal-content select {
            width: 100%;
            padding: 8px 12px;
            margin-top: 6px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 8px;
            outline: none;
        }

        .modal-buttons {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="text-controls">
        <button onclick="addTextBox()">Add Text Box</button>
    </div>

    <div class="top-controls">
        <button class="settings-btn" onclick="openSettings()">Edit Zodiacs</button>
        <div>
            <label for="bgUpload" style="cursor:pointer; color:#38bdf8;">Upload Background</label>
            <input type="file" id="bgUpload" accept="image/*" style="display:none;">
        </div>
    </div>

    <div class="main-container">
        <div class="chart-box">
            <h3>Ball Results (Last 20 Days)</h3>
            <table id="ballsTable">
                <thead>
                    <tr>
                        <th>Day / Date</th>
                        <th>The 7 Balls</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <div class="chart-box">
            <h3>Main Zodiac (Last 20 Days)</h3>
            <table id="zodiacTable">
                <thead>
                    <tr>
                        <th>Day / Date</th>
                        <th>Main Zodiac</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div class="bottom-panel">
        <div class="balls-container" id="interactiveBalls">
            <div class="ball-wrapper">
                <div class="lottery-ball ball-green" contenteditable="true" data-ball="25">
                    <span class="num-val">25</span>
                    <span class="z-sub" contenteditable="true">Aries</span>
                </div>
            </div>
            <div class="ball-wrapper">
                <div class="lottery-ball ball-green" contenteditable="true" data-ball="26">
                    <span class="num-val">26</span>
                    <span class="z-sub" contenteditable="true">Taurus</span>
                </div>
            </div>
            <div class="ball-wrapper">
                <div class="lottery-ball ball-green" contenteditable="true" data-ball="27">
                    <span class="num-val">27</span>
                    <span class="z-sub" contenteditable="true">Gemini</span>
                </div>
            </div>
            <div class="ball-wrapper">
                <div class="lottery-ball ball-green" contenteditable="true" data-ball="28">
                    <span class="num-val">28</span>
                    <span class="z-sub" contenteditable="true">Cancer</span>
                </div>
            </div>
            <div class="ball-wrapper">
                <div class="lottery-ball ball-green" contenteditable="true" data-ball="29">
                    <span class="num-val">29</span>
                    <span class="z-sub" contenteditable="true">Leo</span>
                </div>
            </div>
            <div class="ball-wrapper">
                <div class="lottery-ball ball-green" contenteditable="true" data-ball="30">
                    <span class="num-val">30</span>
                    <span class="z-sub" contenteditable="true">Virgo</span>
                </div>
            </div>
            <div class="ball-wrapper">
                <div class="lottery-ball ball-green" contenteditable="true" data-ball="31">
                    <span class="num-val">31</span>
                    <span class="z-sub" contenteditable="true">Libra</span>
                </div>
            </div>
        </div>
        <button onclick="saveTodayResults()" class="save-btn">Save Today's Results</button>
    </div>

    <div class="floating-text" id="defaultText" onmousedown="makeDraggable(this, event)">
        <input type="text" class="editable-input" placeholder=" ">
        <div class="watermark-text">Type your text here</div>
        <div class="text-formatting-bar">
            Size: <input type="number" value="16" style="width: 50px;" onchange="changeFontSize(this)">
            Color: <input type="color" value="#ffffff" onchange="changeFontColor(this)">
            Font: <select onchange="changeFontFamily(this)" style="background:#0f172a; color:#fff; border:1px solid #334155; border-radius:4px;">
                <option value="Segoe UI">Segoe UI</option>
                <option value="Arial">Arial</option>
                <option value="Courier New">Courier New</option>
                <option value="Georgia">Georgia</option>
            </select>
        </div>
    </div>

    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3>Manage Zodiac List</h3>
            <div id="zodiacListContainer"></div>
            <button onclick="addZodiacInput()" style="margin-top: 12px; padding: 6px 12px; background:#334155; color:#fff; border:none; border-radius:6px; cursor:pointer;">Add Zodiac</button>
            <div class="modal-buttons">
                <button onclick="saveSettings()" class="save-btn">Save</button>
                <button onclick="closeSettings()" style="background:#475569; color:#fff; border:none; padding:8px 16px; border-radius:8px; cursor:pointer;">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('bgUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.body.style.backgroundImage = `url('${event.target.result}')`;
                    document.body.style.backgroundSize = 'cover';
                    document.body.style.backgroundPosition = 'center';
                }
                reader.readAsDataURL(file);
            }
        });

        let historyData = JSON.parse(localStorage.getItem('ballHistory')) || [];
        let customZodiacs = JSON.parse(localStorage.getItem('customZodiacs')) || ['Aries', 'Taurus', 'Gemini', 'Cancer', 'Leo', 'Virgo', 'Libra', 'Scorpio', 'Sagittarius', 'Capricorn', 'Aquarius', 'Pisces'];

        function getBallClass(num) {
            let n = parseInt(num);
            if (isNaN(n)) return 'ball-green';
            let mod = (n - 1) % 48 + 1;
            return (mod >= 1 && mod <= 24) ? 'ball-green' : 'ball-red';
        }

        function updateInteractiveBallColors() {
            const ballWrappers = document.querySelectorAll('#interactiveBalls .ball-wrapper');
            ballWrappers.forEach(wrapper => {
                const ball = wrapper.querySelector('.lottery-ball');
                const num = ball.querySelector('.num-val').innerText;
                ball.className = `lottery-ball ${getBallClass(num)}`;
            });
        }

        function renderTables() {
            const ballsTbody = document.querySelector('#ballsTable tbody');
            const zodiacTbody = document.querySelector('#zodiacTable tbody');
            
            ballsTbody.innerHTML = '';
            zodiacTbody.innerHTML = '';

            historyData.forEach((item, index) => {
                let ballsFormatted = item.balls.map(b => {
                    let colorClass = getBallClass(b.num);
                    return `<div class="lottery-ball ${colorClass}">
                                <span class="num-val">${b.num}</span>
                                <span class="z-sub">${b.zodiac}</span>
                            </div>`;
                }).join(' ');

                let ballRow = `<tr><td>Day ${index + 1} (${item.date})</td><td>${ballsFormatted}</td></tr>`;
                ballsTbody.innerHTML += ballRow;

                let zodiacRow = `<tr><td>Day ${index + 1} (${item.date})</td><td><span style="display:inline-block; padding:6px 14px; background:rgba(236, 72, 153, 0.15); color:#f472b6; border-radius:20px; font-weight:600;">${item.mainZodiac || '-'}</span></td></tr>`;
                zodiacTbody.innerHTML += zodiacRow;
            });
        }

        function saveTodayResults() {
            const ballWrappers = document.querySelectorAll('#interactiveBalls .ball-wrapper');
            let currentBalls = [];

            ballWrappers.forEach(wrapper => {
                const num = wrapper.querySelector('.num-val').innerText;
                const zodiac = wrapper.querySelector('.z-sub').innerText;
                currentBalls.push({ num, zodiac });
            });

            const randomMainZodiac = customZodiacs[Math.floor(Math.random() * customZodiacs.length)];

            const todayRecord = {
                date: new Date().toLocaleDateString(),
                balls: currentBalls,
                mainZodiac: randomMainZodiac
            };

            historyData.unshift(todayRecord);

            if (historyData.length > 20) {
                historyData.pop();
            }

            localStorage.setItem('ballHistory', JSON.stringify(historyData));
            renderTables();
        }

        document.addEventListener('input', function(e) {
            if (e.target.classList.contains('num-val')) {
                updateInteractiveBallColors();
            }
        });

        function makeDraggable(elmnt, e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'BUTTON') return;
            
            let pos1 = 0, pos2 = 0, pos3 = e.clientX, pos4 = e.clientY;
            
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;

            function elementDrag(e) {
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
                elmnt.style.transform = "none";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }

        function addTextBox() {
            const newDiv = document.createElement('div');
            newDiv.className = 'floating-text';
            newDiv.style.top = '150px';
            newDiv.style.left = '50%';
            newDiv.innerHTML = `
                <input type="text" class="editable-input" placeholder=" ">
                <div class="watermark-text">Type your text here</div>
                <div class="text-formatting-bar">
                    Size: <input type="number" value="16" style="width: 50px;" onchange="changeFontSize(this)">
                    Color: <input type="color" value="#ffffff" onchange="changeFontColor(this)">
                    Font: <select onchange="changeFontFamily(this)" style="background:#0f172a; color:#fff; border:1px solid #334155; border-radius:4px;">
                        <option value="Segoe UI">Segoe UI</option>
                        <option value="Arial">Arial</option>
                        <option value="Courier New">Courier New</option>
                        <option value="Georgia">Georgia</option>
                    </select>
                </div>
            `;
            newDiv.onmousedown = function(e) { makeDraggable(this, e); };
            document.body.appendChild(newDiv);
        }

        function changeFontSize(input) {
            const container = input.closest('.floating-text');
            const watermark = container.querySelector('.watermark-text');
            const textInput = container.querySelector('.editable-input');
            const size = input.value + 'px';
            watermark.style.fontSize = size;
            textInput.style.fontSize = size;
        }

        function changeFontColor(input) {
            const container = input.closest('.floating-text');
            const watermark = container.querySelector('.watermark-text');
            const textInput = container.querySelector('.editable-input');
            const color = input.value;
            watermark.style.color = color;
            textInput.style.color = color;
        }

        function changeFontFamily(select) {
            const container = input.closest('.floating-text');
            const watermark = container.querySelector('.watermark-text');
            const textInput = container.querySelector('.editable-input');
            const font = select.value;
            watermark.style.fontFamily = font;
            textInput.style.fontFamily = font;
        }

        function openSettings() {
            const container = document.getElementById('zodiacListContainer');
            container.innerHTML = '';
            customZodiacs.forEach((zodiac) => {
                container.innerHTML += `<div style="display:flex; gap:8px; margin-bottom:8px;">
                    <input type="text" value="${zodiac}" class="zodiac-input-item" style="flex:1;">
                    <button onclick="this.parentElement.remove()" style="background:#ef4444; color:#fff; border:none; padding:4px 10px; border-radius:6px; cursor:pointer;">X</button>
                </div>`;
            });
            document.getElementById('settingsModal').style.display = 'flex';
        }

        function addZodiacInput() {
            const container = document.getElementById('zodiacListContainer');
            container.innerHTML += `<div style="display:flex; gap:8px; margin-bottom:8px;">
                <input type="text" value="New Zodiac" class="zodiac-input-item" style="flex:1;">
                <button onclick="this.parentElement.remove()" style="background:#ef4444; color:#fff; border:none; padding:4px 10px; border-radius:6px; cursor:pointer;">X</button>
            </div>`;
            }

        function saveSettings() {
            const inputs = document.querySelectorAll('.zodiac-input-item');
            customZodiacs = [];
            inputs.forEach(input => {
                if(input.value.trim() !== '') customZodiacs.push(input.value.trim());
            });
            localStorage.setItem('customZodiacs', JSON.stringify(customZodiacs));
            closeSettings();
        }

        function closeSettings() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        updateInteractiveBallColors();
        renderTables();
    </script>
</body>
</html>
